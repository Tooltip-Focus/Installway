[package]
name = "winui_support"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
common = { path = "../common" }
windows-reactor = { git = "https://github.com/microsoft/windows-rs.git", rev = "317646c941aa18916ffa5daeb4ffd5ffa4cd26f3" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
] }
