[package]
name = "installer_builder"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
blake3 = "1.8"
rayon = "1.12"
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = "0.10"
hex = "0.4"
glob = "0.3"
editpe = { version = "0.2.4", default-features = false, features = ["std"] }
indexmap = "2"
tempfile = "3"

[build-dependencies]
embed-manifest = "1.5"
