name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  # Portable kit: builder + stubs compiled with the shared key, zipped for the release.
  kit:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Same vcpkg setup as ci.yml: PakLib's builtin-baseline is newer than
      # the runner image's vcpkg clone.
      - name: Update vcpkg
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if ((git -C $vcpkg rev-parse --is-shallow-repository) -eq 'true') {
            git -C $vcpkg fetch --quiet --unshallow origin
          }
          git -C $vcpkg fetch --quiet origin master
          git -C $vcpkg checkout --quiet FETCH_HEAD
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ hashFiles('vendor/PakLib/vcpkg.json') }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build and test the kit
        shell: pwsh
        env:
          PRIV_KEY: ${{ secrets.INSTALLWAY_SHARED_PRIV_KEY }}
          PUB_KEY: ${{ vars.INSTALLWAY_SHARED_PUB_KEY || secrets.INSTALLWAY_SHARED_PUB_KEY }}
        run: |
          if (-not $env:PRIV_KEY -or -not $env:PUB_KEY) {
            throw 'Missing the INSTALLWAY_SHARED_PRIV_KEY secret or the INSTALLWAY_SHARED_PUB_KEY variable (generate them with installer_builder keygen)'
          }
          ./scripts/build-kit.ps1 -PrivKeyHex $env:PRIV_KEY -PubKeyHex $env:PUB_KEY -OutDir dist/kit

      - name: Zip the kit
        shell: pwsh
        run: |
          $zip = "dist/installway-kit-$env:GITHUB_REF_NAME-x64.zip"
          Compress-Archive -Path dist/kit/* -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/$zip.sha256", "$hash  $(Split-Path -Leaf $zip)`n")

      - uses: actions/upload-artifact@v4
        with:
          name: kit
          path: dist/kit/

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    needs: kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v1.2.0-rc.1) is published as a pre-release.
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease dist/*

  # Windows container images on GHCR. Plain `docker build`: buildx does not
  # build Windows containers. The ltsc2022 base needs a windows-2022 host.
  docker:
    needs: kit
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: prebuilt
            dockerfile: ci/docker/prebuilt.Dockerfile
            context: ci/docker
            suffix: ''
            test_args: ''
          - flavor: toolchain
            dockerfile: ci/docker/toolchain.Dockerfile
            context: .
            suffix: -toolchain
            test_args: -CustomKey
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/download-artifact@v4
        if: matrix.flavor == 'prebuilt'
        with:
          name: kit
          path: ci/docker/kit

      - name: Build image
        shell: pwsh
        run: |
          docker build -f ${{ matrix.dockerfile }} -t installway:ci `
            --label "org.opencontainers.image.source=https://github.com/$env:GITHUB_REPOSITORY" `
            --label "org.opencontainers.image.version=$env:GITHUB_REF_NAME" `
            ${{ matrix.context }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test image
        shell: pwsh
        run: ./scripts/test-packaging.ps1 -Image installway:ci ${{ matrix.test_args }}

      - name: Push image
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          $image = "ghcr.io/$($env:GITHUB_REPOSITORY_OWNER.ToLowerInvariant())/installway"
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          # v1.2.3 -> 1.2.3, 1.2, latest (or -toolchain variants);
          # a pre-release tag only gets its exact version.
          $tags = @("$ver$env:SUFFIX")
          if ($ver -notmatch '-') {
            $parts = $ver.Split('.')
            if ($parts.Count -ge 2) { $tags += "$($parts[0]).$($parts[1])$env:SUFFIX" }
            $tags += if ($env:SUFFIX) { $env:SUFFIX.TrimStart('-') } else { 'latest' }
          }
          $env:GH_TOKEN | docker login ghcr.io -u $env:GITHUB_ACTOR --password-stdin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($tag in $tags) {
            docker tag installway:ci "${image}:$tag"
            docker push "${image}:$tag"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
